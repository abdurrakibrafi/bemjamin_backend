services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./benjaminkley.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      web:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  db-migrator:
    build: .
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: ["/app/docker-entrypoint.sh", "migrate"]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: ["/app/docker-entrypoint.sh", "web"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  celery-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./media:/app/media
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: ["/app/docker-entrypoint.sh", "celery-worker"]
    healthcheck:
      test: ["CMD", "celery", "-A", "benjaminkley", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  celery-beat:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    command: ["/app/docker-entrypoint.sh", "celery-beat"]
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  pgbouncer:
    image: "edoburu/pgbouncer:latest"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=host.docker.internal
      - DB_NAME=${DB_NAME}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=5
      - AUTH_TYPE=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: '0.5'

volumes:
  static_volume:
  redis_data: